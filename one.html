<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Webpage 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 40px;
            display: grid;
            place-items: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }

        figure {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: 0.4s ease;
            overflow: hidden;
        }

        figure:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 15px;
            transition: 0.4s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            padding: 8px 18px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f5ff, #ff00f7);
            transition: 0.3s;
        }

        figcaption a:hover {
            background: linear-gradient(135deg, #ff00f7, #00f5ff);
            transform: scale(1.1);
        }

        #container {
            display: flex;
            justify-content: center;
            gap: 17px;
            cursor: pointer;

            div {
                padding: 3px 15px;
                border-radius: 4px;
                background: #000;
                color: white;
                font-size: 20px;
            }
        }

        #container::selection {
            background-color: black;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <figure>
            <img src="images/images (1).jpg" id="img1" alt="mobile" onmouseover="changeImage(1)"
                onmouseout="realimage(1)">
            <figcaption>
                <div id="container">
                    <div id="num1">0</div>
                    <div onclick="calc(1)">+</div>
                    <div onclick="calc(-1)">-</div>
                </div>
                <a href="#" onclick="num1()">Vivo Ultra</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (2).jpg" id="img2" alt="mobile" onmouseover="changeImage(2)"
                onmouseout="realimage(2)">
            <figcaption>
                <div id="container">
                    <div id="num2">0</div>
                    <div onclick="calc(2)">+</div>
                    <div onclick="calc(-2)">-</div>
                </div>
                <a href="#" onclick="numdetail2()">Iphone 11</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (3).jpg" id="img3" alt="mobile" onmouseover="changeImage(3)"
                onmouseout="realimage(3)">
            <figcaption>
                <div id="container">
                    <div id="num3">0</div>
                    <div onclick="calc(3)">+</div>
                    <div onclick="calc(-3)">-</div>
                </div>
                <a href="#" onclick="numdetail3()">Vivo A10</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (4).jpg" id="img4" alt="mobile" onmouseover="changeImage(4)"
                onmouseout="realimage(4)">
            <figcaption>
                <div id="container">
                    <div id="num4">0</div>
                    <div onclick="calc(4)">+</div>
                    <div onclick="calc(-4)">-</div>
                </div>
                <a href="#" onclick="numdetail4()">Redmi A3x</a>
            </figcaption>
        </figure>
    </div>

    <script src="one.js"></script>
</body>

</html>

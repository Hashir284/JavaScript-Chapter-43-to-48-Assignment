<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Webpage 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 40px;
            display: grid;
            place-items: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }

        figure {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            transition: 0.4s ease;
            overflow: hidden;
        }

        figure:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(0,0,0,0.45);
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 15px;
            transition: 0.4s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            padding: 8px 18px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f5ff, #ff00f7);
            transition: 0.3s;
        }

        figcaption a:hover {
            background: linear-gradient(135deg, #ff00f7, #00f5ff);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="gallery">
        <figure>
            <img src="images/images (1).jpg" alt="mobile">
            <figcaption>
                <a href="#" onclick="alert('Thanks for purchasing the Vivo Ultra phone from us')">Vivo Ultra</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (2).jpg" alt="mobile">
            <figcaption>
                <a href="#" onclick="alert('Thanks for purchasing the Iphone 11 phone from us')">Iphone 11</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (3).jpg" alt="mobile">
            <figcaption>
                <a href="#" onclick="alert('Thanks for purchasing the Vivo A10 phone from us')">Vivo A10</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (4).jpg" alt="mobile">
            <figcaption>
                <a href="#" onclick="alert('Thanks for purchasing the Redmi A3x phone from us')">Redmi A3x</a>
            </figcaption>
        </figure>
    </div>

</body>
</html>

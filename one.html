<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Webpage 1</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            padding: 40px;
            display: grid;
            place-items: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1100px;
            width: 100%;
        }

        figure {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: 0.4s ease;
            overflow: hidden;
        }

        figure:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 15px;
            transition: 0.4s ease;
        }

        figure:hover img {
            transform: scale(1.08);
        }

        figcaption a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            padding: 8px 18px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00f5ff, #ff00f7);
            transition: 0.3s;
        }

        figcaption a:hover {
            background: linear-gradient(135deg, #ff00f7, #00f5ff);
            transform: scale(1.1);
        }

        #container {
            display: flex;
            justify-content: center;
            gap: 17px;
            cursor: pointer;

            div {
                padding: 3px 15px;
                border-radius: 4px;
                background: #000;
                color: white;
                font-size: 20px;
            }
        }

        #container::selection {
            background-color: black;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <figure>
            <img src="images/images (1).jpg" id="img1" alt="mobile" onmouseover="changeImage(1)"
                onmouseout="realimage(1)">
            <figcaption>
                <div id="container">
                    <div id="num1">0</div>
                    <div onclick="calc(1)">+</div>
                    <div onclick="calc(-1)">-</div>
                </div>
                <a href="#" onclick="num1()">Vivo Ultra</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (2).jpg" id="img2" alt="mobile" onmouseover="changeImage(2)"
                onmouseout="realimage(2)">
            <figcaption>
                <div id="container">
                    <div id="num2">0</div>
                    <div onclick="calc(2)">+</div>
                    <div onclick="calc(-2)">-</div>
                </div>
                <a href="#" onclick="numdetail2()">Iphone 11</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (3).jpg" id="img3" alt="mobile" onmouseover="changeImage(3)"
                onmouseout="realimage(3)">
            <figcaption>
                <div id="container">
                    <div id="num3">0</div>
                    <div onclick="calc(3)">+</div>
                    <div onclick="calc(-3)">-</div>
                </div>
                <a href="#" onclick="numdetail3()">Vivo A10</a>
            </figcaption>
        </figure>

        <figure>
            <img src="images/images (4).jpg" id="img4" alt="mobile" onmouseover="changeImage(4)"
                onmouseout="realimage(4)">
            <figcaption>
                <div id="container">
                    <div id="num4">0</div>
                    <div onclick="calc(4)">+</div>
                    <div onclick="calc(-4)">-</div>
                </div>
                <a href="#" onclick="numdetail4()">Redmi A3x</a>
            </figcaption>
        </figure>
    </div>

    <script>
        function changeImage(i) {
            if (i === 1) {
                let random = Math.floor((Math.random() * 4) + 1)
                if (random === 1) {
                    random = 3
                }
                document.getElementById('img1').src = `images/images (${random}).jpg`
            } else if (i === 2) {
                let random = Math.floor((Math.random() * 4) + 1)
                if (random === 2) {
                    random = 4
                }
                document.getElementById('img2').src = `images/images (${random}).jpg`
            } else if (i === 3) {
                let random = Math.floor((Math.random() * 4) + 1)
                if (random === 3) {
                    random = 1
                }
                document.getElementById('img3').src = `images/images (${random}).jpg`
            } else if (i === 4) {
                let random = Math.floor((Math.random() * 4) + 1)
                if (random === 4) {
                    random = 2
                }
                document.getElementById('img4').src = `images/images (${random}).jpg`
            }
        }
        function realimage(i) {
            if (i === 1) {
                document.getElementById('img1').src = `images/images (1).jpg`
            } else if (i === 2) {
                document.getElementById('img2').src = `images/images (2).jpg`
            } else if (i === 3) {
                document.getElementById('img3').src = `images/images (3).jpg`
            } else if (i === 4) {
                document.getElementById('img4').src = `images/images (4).jpg`
            }
        }
        let num = 0
        let num2 = 0
        let num3 = 0
        let num4 = 0

        function calc(i) {

            if (i === 1) {
                num++
                if (document.getElementById('num1').innerText = '0') {
                    document.getElementById('num1').innerText = num
                }
                else {
                    document.getElementById('num1').innerText = num
                }
                console.log('num1');
            } else if (i === -1) {
                if (num > 0) {
                    num--
                    if (document.getElementById('num1').innerText = '0') {
                        document.getElementById('num1').innerText = num
                    }
                    else {
                        document.getElementById('num1').innerText = num
                    }
                }
            }

            if (i === 2) {
                num2++
                if (document.getElementById('num2').innerText = '0') {
                    document.getElementById('num2').innerText = num2
                }
                else {
                    document.getElementById('num2').innerText = num2
                }
            } else if (i === -2) {
                if (num2 > 0) {
                    num2--
                    if (document.getElementById('num2').innerText = '0') {
                        document.getElementById('num2').innerText = num2
                    }
                    else {
                        document.getElementById('num2').innerText = num2
                    }
                }
            }

            if (i === 3) {
                num3++
                if (document.getElementById('num3').innerText = '0') {
                    document.getElementById('num3').innerText = num3
                }
                else {
                    document.getElementById('num3').innerText = num3
                }
            } else if (i === -3) {
                if (num3 > 0) {
                    num3--
                    if (document.getElementById('num3').innerText = '0') {
                        document.getElementById('num3').innerText = num3
                    }
                    else {
                        document.getElementById('num3').innerText = num3
                    }
                }
            }

            if (i === 4) {
                num4++
                if (document.getElementById('num4').innerText = '0') {
                    document.getElementById('num4').innerText = num4
                }
                else {
                    document.getElementById('num4').innerText = num4
                }
            } else if (i === -4) {
                if (num4 > 0) {
                    num4--
                    if (document.getElementById('num4').innerText = '0') {
                        document.getElementById('num4').innerText = num4
                    }
                    else {
                        document.getElementById('num4').innerText = num4
                    }
                }
            }
        }

        function num1() {
            let imgv1 = document.getElementById('num1').innerText

            if (imgv1 > 0) {
                alert(`Thanks for purchasing the ${imgv1}phone of VivoUltra from us`)
            } else {
                alert('Plz! Enter the Order Quantity')
            }
        }

        function numdetail2() {
            let imgv1 = document.getElementById('num2').innerText

            if (imgv1 > 0) {
                alert(`Thanks for purchasing the ${imgv1}phone of Iphone11 from us`)
            } else {
                alert('Plz! Enter the Order Quantity')
            }
        }

        function numdetail3() {
            let imgv1 = document.getElementById('num3').innerText

            if (imgv1 > 0) {
                alert(`Thanks for purchasing the ${imgv1}phone of VivoA10 from us`)
            } else {
                alert('Plz! Enter the Order Quantity')
            }
        }

        function numdetail4() {
            let imgv1 = document.getElementById('num4').innerText

            if (imgv1 > 0) {
                alert(`Thanks for purchasing the ${imgv1}phone of RedmiA3x from us`)
            } else {
                alert('Plz! Enter the Order Quantity')
            }
        }


    </script>
</body>

</html>

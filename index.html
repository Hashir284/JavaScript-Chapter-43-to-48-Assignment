<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Chp 43–48</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f2027, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .box {
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 100px 100px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            background:
                linear-gradient(#000, #000) padding-box,
                linear-gradient(135deg, #00f5ff, #ff00f7) border-box;
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.4);
            animation: pulse 3s infinite alternate;
        }

        h1 {
            color: #00f5ff;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-size: 30px;
        }

        .btn {
            display: block;
            margin: 18px 0;
            padding: 22px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-size: 20px;
            position: relative;
            background: #111;
            border: 1px solid #333;
            transition: 0.4s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            color: #00f5ff;
            border-color: #00f5ff;
        }

        @keyframes pulse {
            from {
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            }
            to {
                box-shadow: 0 0 45px rgba(255, 0, 247, 0.6);
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>EVENT ASSIGNMENT</h1>
        <a href="one.html" class="btn">Event Webpage 1</a>
        <a href="two.html" class="btn">Event Webpage 2</a>
    </div>

</body>
</html>
